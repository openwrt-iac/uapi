name: ci

# Triggers:
#   - push to main: run unit + lint + integration (no release).
#   - pull_request: run unit + lint + integration (no release).
#   - push of a v* tag: run unit + lint + integration, then release-apk if all passed.
#   - workflow_dispatch: useful for re-running CI manually; release-apk only fires
#     when dispatched against a v* tag ref (the job-level `if:` enforces it).
on:
  push:
    # GitHub trigger filter-patterns are NOT regex: `+` is literal, `[0-9]` is a
    # character class without quantifier. Use a broad pattern; the real release
    # gate is the job-level `if:` on release-apk (refs/tags/v* startsWith).
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Workflow-level permissions are read-only by default; release-apk overrides
# to contents: write at the job level so unit/lint/integration run least-privilege.
permissions:
  contents: read

# Cancel superseded runs for branch / PR pushes to save runner minutes; never
# cancel a tag-triggered run that may be mid-publish to the GitHub Release.
# workflow_dispatch runs (operator-triggered pre-tag validation, often slow
# because of verify-arch-build) get their own concurrency group so an
# unrelated push to main doesn't kill them mid-run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: >-
    ${{ !startsWith(github.ref, 'refs/tags/')
        && github.event_name != 'workflow_dispatch' }}

env:
  OPENWRT_VERSION: 25.12.4
  OPENWRT_IMAGE_CACHE_KEY: openwrt-25.12.4-x86-64-ext4-combined
  OPENWRT_SDK_CACHE_KEY: openwrt-sdk-25.12.4-x86_64
  OPENWRT_SDK_URL: https://downloads.openwrt.org/releases/25.12.4/targets/x86/64/openwrt-sdk-25.12.4-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst

jobs:
  unit:
    runs-on: ubuntu-latest
    container:
      image: alpine:edge
    steps:
      - name: Install ucode and tooling
        run: apk add --no-cache ucode make grep findutils
      - uses: actions/checkout@v6
      - name: Unit tests
        run: make test-unit
      - name: Property-fuzz pass (high iter)
        run: PROPERTY_ITERS=1000 make test-property
      - name: Coverage inventory (modules + functions)
        run: make coverage

  lint:
    runs-on: ubuntu-latest
    container:
      image: alpine:edge
    steps:
      - name: Install ucode and tooling
        run: apk add --no-cache ucode make grep findutils
      - uses: actions/checkout@v6
      - name: Lint (em-dash + ucode syntax + reserved-name guard)
        run: make lint
      - name: OpenAPI contract is up to date
        run: make openapi-check
      - name: Package staging succeeds
        run: make stage

  integration:
    runs-on: ubuntu-latest
    needs: [unit, lint]
    steps:
      - uses: actions/checkout@v6

      - name: Install QEMU and SSH client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils openssh-client curl jq

      - name: Cache OpenWrt image
        uses: actions/cache@v5
        with:
          path: tests/vm/openwrt-${{ env.OPENWRT_VERSION }}.img.gz
          key: ${{ env.OPENWRT_IMAGE_CACHE_KEY }}

      - name: Setup VM image
        run: tests/vm/setup.sh

      - name: Start VM
        run: tests/vm/start.sh

      - name: Wait for VM SSH
        run: TIMEOUT=180 tests/vm/wait.sh

      - name: Run integration tests
        run: tests/integration/run.sh

      - name: Soak test (60s read-only with RSS/fd leak watch)
        run: DURATION=60 PARALLEL=2 tests/soak/ci_soak.sh

      - name: Perf bench + regression gate
        run: N=50 tests/bench/ci_bench.sh

      - name: Upload bench result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-run
          path: bench/run-*.json
          if-no-files-found: ignore

      - name: Capture serial log on failure
        if: failure()
        run: tail -200 tests/vm/qemu.log || true

      - name: Stop VM
        if: always()
        run: tests/vm/stop.sh

  # release-apk attaches the APK to the GitHub Release. The apk feed
  # itself is rebuilt elsewhere (openwrt-iac/openwrt-iac.github.io's
  # publish.yml pulls latest stable from each source repo); this job just
  # makes sure a successful tag has a downloadable asset. Three guards
  # apply: needs:[unit,lint,integration], job-level v* tag check, and a
  # step-level if on the release-upload step. Smoke test in QEMU runs
  # before the upload; a failing smoke keeps the apk off the GitHub Release.
  release-apk:
    runs-on: ubuntu-latest
    needs: [unit, lint, integration]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # need tag object for verify-tag

      # Tags MUST be signed by a key in .github/release-signers.asc. CI
      # imports the file's keys into a clean keyring and runs `git verify-tag`;
      # an unsigned tag or one signed by a non-listed key fails the workflow
      # before any artifact is built or published.
      - name: Verify tag signature
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! grep -q 'BEGIN PGP PUBLIC KEY BLOCK' .github/release-signers.asc; then
            echo "ERROR: .github/release-signers.asc has no PGP public-key block."
            echo "Export your key with: gpg --armor --export <fingerprint> > .github/release-signers.asc"
            exit 1
          fi
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --import .github/release-signers.asc
          git verify-tag "$TAG"

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils openssh-client curl zstd \
            build-essential libncurses-dev libssl-dev python3 \
            unzip gawk gettext xsltproc rsync wget

      - name: Cache OpenWrt SDK
        uses: actions/cache@v5
        with:
          path: build/sdk
          key: ${{ env.OPENWRT_SDK_CACHE_KEY }}

      - name: Verify SDK pin is in sync with OPENWRT_VERSION
        run: |
          SDK_TARBALL=$(basename "$OPENWRT_SDK_URL")
          grep -q "  $SDK_TARBALL\$" build/sdk.sha256 || {
            echo "ERROR: build/sdk.sha256 does not pin $SDK_TARBALL."
            echo "OPENWRT_VERSION=$OPENWRT_VERSION; OPENWRT_SDK_URL=$OPENWRT_SDK_URL."
            echo "Regenerate the checksum from upstream and commit it."
            exit 1
          }

      - name: Download SDK if cache miss (verified by sha256)
        run: |
          if [ ! -d build/sdk/staging_dir ]; then
            mkdir -p build/sdk
            SDK_TARBALL=$(basename "$OPENWRT_SDK_URL")
            curl -fsSL -o "/tmp/$SDK_TARBALL" "$OPENWRT_SDK_URL"
            ( cd /tmp && sha256sum --check "$GITHUB_WORKSPACE/build/sdk.sha256" )
            tar --use-compress-program=unzstd -xf "/tmp/$SDK_TARBALL" -C build/sdk --strip-components=1
            rm -f "/tmp/$SDK_TARBALL"
          fi

      - name: Cache OpenWrt VM image
        uses: actions/cache@v5
        with:
          path: tests/vm/openwrt-${{ env.OPENWRT_VERSION }}.img.gz
          key: ${{ env.OPENWRT_IMAGE_CACHE_KEY }}

      - name: Stage package (uses checked-in build/openapi.json)
        run: make stage

      - name: Build APK
        run: |
          cd build/sdk
          ./scripts/feeds update -a || true
          ./scripts/feeds install -a || true
          ln -sfn ../../openwrt/uapi package/uapi
          make defconfig
          make package/uapi/compile V=s

      - name: Find built APK
        id: find_apk
        run: |
          APK=$(find build/sdk/bin -name 'uapi-*.apk' | head -1)
          [ -n "$APK" ] || { echo "no .apk built"; exit 1; }
          echo "apk=$APK" >> $GITHUB_OUTPUT
          ls -la "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: uapi-apk
          path: ${{ steps.find_apk.outputs.apk }}

      # SBOM (SPDX 2.3). Generated against the staged tree, with the built
      # APK's sha256 stamped into the top-level package verification field.
      # Uploaded as a workflow artifact AND attached to the GitHub Release
      # alongside the APK so SBOM-aware consumers (cosign / syft) see it.
      - name: Generate SBOM
        run: make sbom APK="${{ steps.find_apk.outputs.apk }}"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: uapi-sbom
          path: build/sbom.spdx.json

      # Smoke test the built APK in a fresh VM before publishing anywhere.
      # If the smoke test fails the publish steps below never run.
      - name: Setup VM
        run: tests/vm/setup.sh

      - name: Start VM
        run: tests/vm/start.sh

      - name: Wait for VM SSH
        run: TIMEOUT=180 tests/vm/wait.sh

      - name: Install APK in VM and run smoke test
        run: tests/integration/release_apk_smoke.sh "${{ steps.find_apk.outputs.apk }}"

      - name: Capture serial log on failure
        if: failure()
        run: tail -200 tests/vm/qemu.log || true

      - name: Stop VM
        if: always()
        run: tests/vm/stop.sh

      # Step-level guard 3a: only attach to a GitHub release on a real v* tag push.
      # Redundant with the job-level if; kept so a future loosening of the job guard
      # still cannot publish a release from a non-tag ref.
      - name: Attach APK to GitHub release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            case "$TAG" in
              *-rc*|*-alpha*|*-beta*|*-pre*)
                PRE=--prerelease ;;
              *)
                PRE= ;;
            esac
            chmod +x scripts/release-notes.sh
            scripts/release-notes.sh "$TAG" > /tmp/release-notes.md
            if [ -s /tmp/release-notes.md ]; then
              gh release create "$TAG" $PRE --title "$TAG" --notes-file /tmp/release-notes.md
            else
              gh release create "$TAG" $PRE --title "$TAG" --generate-notes
            fi
          fi
          gh release upload "$TAG" "${{ steps.find_apk.outputs.apk }}" --clobber
          # SBOM lives next to the APK; gh release upload is best-effort on the
          # SBOM (the APK is the gate, the SBOM is supplementary metadata).
          [ -r build/sbom.spdx.json ] && \
            gh release upload "$TAG" build/sbom.spdx.json --clobber || true

      # The signed APK feed lives at openwrt-iac.github.io/feed/ and is
      # rebuilt by openwrt-iac/openwrt-iac.github.io's publish.yml workflow,
      # which pulls the latest stable release asset from every source repo
      # listed in its feed.yml. uapi no longer pushes to a gh-pages feed
      # of its own; attaching the APK to this GitHub Release is the whole
      # job, and the aggregator picks it up on its next run.

  # Multi-arch build verification. uapi is PKGARCH:=all (pure ucode + shell;
  # no compiled code), so the resulting APK is byte-identical across host
  # archs - this job exists to PROVE that invariant, not to ship per-arch
  # artifacts. If any arch's APK diverges from the x86_64 reference,
  # something arch-specific snuck into the build and the release should be
  # held. Runs on tag push in parallel with release-apk so neither blocks
  # the other.
  #
  # To enable additional arches: add an entry to the matrix below and a
  # corresponding sha256 line to build/sdk.sha256 (per-arch SDK tarball
  # checksum). The fail-fast: false flag lets the operator see all arch
  # results in one CI run instead of stopping at the first failure.
  verify-arch-build:
    runs-on: ubuntu-latest
    needs: [unit, lint, integration]
    # Tag pushes auto-fire. Manual workflow_dispatch also fires so operators
    # can validate the per-arch SDK pins against a candidate before tagging.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64_generic
            sdk_url: https://downloads.openwrt.org/releases/25.12.4/targets/armsr/armv8/openwrt-sdk-25.12.4-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          - arch: arm_cortex-a7
            sdk_url: https://downloads.openwrt.org/releases/25.12.4/targets/mediatek/mt7622/openwrt-sdk-25.12.4-mediatek-mt7622_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          - arch: mips_24kc
            sdk_url: https://downloads.openwrt.org/releases/25.12.4/targets/ath79/generic/openwrt-sdk-25.12.4-ath79-generic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
    steps:
      - uses: actions/checkout@v6

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl zstd build-essential libncurses-dev libssl-dev python3 \
            unzip gawk gettext xsltproc rsync wget

      - name: Cache OpenWrt SDK (${{ matrix.arch }})
        uses: actions/cache@v5
        with:
          path: build/sdk-${{ matrix.arch }}
          key: openwrt-sdk-25.12.4-${{ matrix.arch }}

      - name: Verify per-arch SDK pin
        run: |
          SDK_TARBALL=$(basename "${{ matrix.sdk_url }}")
          if ! grep -q "  $SDK_TARBALL\$" build/sdk.sha256; then
            echo "ERROR: build/sdk.sha256 does not pin $SDK_TARBALL."
            echo "Add a 'sha256  $SDK_TARBALL' line for arch ${{ matrix.arch }} before tagging."
            echo "Compute via: curl -fsSL ${{ matrix.sdk_url }} | sha256sum"
            exit 1
          fi

      - name: Download SDK if cache miss
        run: |
          if [ ! -d build/sdk-${{ matrix.arch }}/staging_dir ]; then
            mkdir -p build/sdk-${{ matrix.arch }}
            SDK_TARBALL=$(basename "${{ matrix.sdk_url }}")
            curl -fsSL -o "/tmp/$SDK_TARBALL" "${{ matrix.sdk_url }}"
            ( cd /tmp && sha256sum --check "$GITHUB_WORKSPACE/build/sdk.sha256" --ignore-missing )
            tar --use-compress-program=unzstd -xf "/tmp/$SDK_TARBALL" \
                -C build/sdk-${{ matrix.arch }} --strip-components=1
            rm -f "/tmp/$SDK_TARBALL"
          fi

      - name: Stage package
        run: make stage

      - name: Build APK against ${{ matrix.arch }} SDK
        run: |
          cd build/sdk-${{ matrix.arch }}
          ./scripts/feeds update -a || true
          ./scripts/feeds install -a || true
          ln -sfn ../../openwrt/uapi package/uapi
          make defconfig
          make package/uapi/compile V=s

      - name: Find built APK
        id: find_apk
        run: |
          APK=$(find build/sdk-${{ matrix.arch }}/bin -name 'uapi-*.apk' | head -1)
          [ -n "$APK" ] || { echo "no .apk built for ${{ matrix.arch }}"; exit 1; }
          echo "apk=$APK" >> $GITHUB_OUTPUT
          sha256sum "$APK"

      - name: Upload ${{ matrix.arch }} APK
        uses: actions/upload-artifact@v7
        with:
          name: uapi-apk-${{ matrix.arch }}
          path: ${{ steps.find_apk.outputs.apk }}
