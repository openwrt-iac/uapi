name: publish-web

# Push changes under web/ to the gh-pages branch root on every push to main.
# The gh-pages branch also holds the APK feed (packages/) and the signing
# key (uapi-feed.pub.pem); this workflow only touches the static-site files
# that originate from web/ and leaves everything else untouched.
on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-web
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions[bot]"

      - name: Sync web/ into gh-pages
        run: |
          set -eu
          git fetch origin gh-pages:gh-pages
          git worktree add /tmp/gh-pages gh-pages

          # rsync would be ideal but isn't always present on the runner;
          # use cp -a + a manual delete pass scoped to files that previously
          # came from web/. Tracked via a manifest at .web-manifest so we
          # only ever delete files this workflow originally placed.
          MANIFEST=/tmp/gh-pages/.web-manifest
          if [ -r "$MANIFEST" ]; then
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              rm -f "/tmp/gh-pages/$f"
            done < "$MANIFEST"
            # Clean up newly-empty dirs (but never the feed dirs).
            find /tmp/gh-pages -type d -empty \
                -not -path '/tmp/gh-pages/.git*' \
                -not -path '/tmp/gh-pages/packages*' \
                -delete 2>/dev/null || true
          fi

          # Copy web/ contents to gh-pages root.
          ( cd web && find . -type f -print ) > "$MANIFEST"
          ( cd web && tar c . ) | ( cd /tmp/gh-pages && tar x )

          # Stamp the manifest with leading-./ stripped (the tar above uses
          # ./ prefixes the manifest doesn't need).
          sed -i 's|^\./||' "$MANIFEST"

          cd /tmp/gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo "(no changes to publish)"
          else
            git commit -m "web: publish $(git -C $GITHUB_WORKSPACE rev-parse --short HEAD)"
            git push origin gh-pages
          fi
