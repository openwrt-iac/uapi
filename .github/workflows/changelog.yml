name: changelog

# Its own workflow rather than a job in ci.yml: adding or removing the label has to re-run
# this check, and in ci.yml it would re-run the whole integration suite as well.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  entry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The label is read from the API, not from the event payload. A PR created with the label
      # still fires `opened` with a payload from before the label landed, and a job-level `if:`
      # skips without a completed check run, so the failed run from the stale payload stayed the
      # latest `entry` check and every labeled PR paid an amend-and-force-push to clear it.
      # Reading the live state makes whichever run lands last correct, and the job always
      # completes, so the check run always supersedes.
      - name: CHANGELOG.md names this PR under [Unreleased]
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A read that fails stops here: falling through to the entry check reported a labelled PR
        # as missing its entry.
        run: |
          pr=$(curl -sSf --retry 3 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER") || {
            echo "::error::could not read the labels of the PR"
            exit 1
          }
          if printf '%s' "$pr" | jq -e 'any(.labels[].name; . == "changelog-not-needed")' > /dev/null; then
            echo "changelog-not-needed label present, no entry required."
            exit 0
          fi
          scripts/changelog-has-entry.sh "$PR_NUMBER"
